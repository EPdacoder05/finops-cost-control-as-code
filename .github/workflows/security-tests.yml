name: Security Tests

on:
  push:
    branches: [ "main", "staging", "dev", "copilot/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3
      
      - name: Run security tests
        run: |
          cd $GITHUB_WORKSPACE
          python -m pytest tests/test_security.py -v --tb=short
      
      - name: Test security modules import
        run: |
          cd $GITHUB_WORKSPACE
          python -c "from security import *; print('✅ All security modules import successfully')"
